name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[ml,dev]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Check formatting
        run: ruff format --check src scripts tests

      - name: Type-check package
        run: mypy --strict src

      - name: Run tests
        run: python -m pytest -q

      - name: Audit public release contents
        run: python scripts/audit_public_release.py
