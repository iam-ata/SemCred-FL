  - dataset: cic_iot_2023
    split_id: 590fb686703ef03c30314499629f13d8b083f24f45348f3cd289198abcac99ca
    preprocessor_id: e39b411b302da0c97ef766c0d8c9e36caa4c718e65f702f40e78705fde497e8a
    source_family: web_based
    source_family_id: 7
    target_family: benign
