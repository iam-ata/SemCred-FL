[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "semcred-fl"
version = "0.1.0"
description = "Research implementation of LLM-guided dual-view credibility aggregation for federated intrusion detection"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Nahideh Derakhshanfard"},
  {name = "Ata Mohammadi"},
]
keywords = [
  "federated learning",
  "intrusion detection",
  "data poisoning",
  "robust aggregation",
  "semantic credibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
ml = [
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "psutil>=6.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "seaborn>=0.13",
  "torch>=2.3",
]

[project.scripts]
semcred-fl = "semcred_fl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semcred_fl"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "UP", "W"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["semcred_fl"]

[tool.coverage.report]
fail_under = 90
show_missing = true
